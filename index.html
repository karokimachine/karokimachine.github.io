<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Website Template</title>
    <style>
        :root {
            --primary: #2563eb;
            --dark: #1e293b;
            --light: #f8fafc;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            background-color: var(--light);
            color: var(--dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            max-width: 400px;
            width: 100%;
        }
        h2 { margin-top: 0; color: var(--dark); }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        #message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 6px;
            display: none;
            font-size: 0.9rem;
        }
        .success { background-color: #dcfce7; color: #166534; }
    </style>
</head>
<body>

<div class="container">
    <h2>Welcome to Your Site</h2>
    <p>Enter your details below to test the interactivity script.</p>

    <form id="welcomeForm">
        <div class="form-group">
            <label for="userName">Your Name</label>
            <input type="text" id="userName" required placeholder="John Doe">
        </div>
        <button type="submit">Submit Details</button>
    </form>

    <div id="message"></div>
</div>

<script>
    // Client-side script handling form submission interactivity
    document.getElementById('welcomeForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const nameInput = document.getElementById('userName').value;
        const messageDiv = document.getElementById('message');

        // Display a personalized alert safely inside the DOM
        messageDiv.className = 'success';
        messageDiv.textContent = `Hello, ${nameInput}! Your interactive website script is running perfectly.`;
        messageDiv.style.display = 'block';
    });
</script>

</body>
</html>
